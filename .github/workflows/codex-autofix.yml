# Codex runs a fixed formatting-and-lint task on a labelled issue. Issue title and
# body are never interpolated into the prompt, and the job holds read scope on
# contents with write scope only on pull requests.

name: Codex Autofix on Issue

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  codex-autofix:
    if: |
      github.event.label.name == 'autofix' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run Codex formatting and lint pass
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e  # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Run automated code formatting and linting across the repository.
            Make only formatting and lint fixes. Do not change behaviour, do not
            add dependencies, and do not modify files under .github/.
          model: codex-1
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Post completion comment
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Codex autofix completed. Check for an open PR with the fix.'
            })
