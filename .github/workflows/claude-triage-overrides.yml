# Issue triage on the vendor defaults: the write-access actor gate and bot gate are
# left in place, subprocess secret scrubbing stays on, output is not echoed to the
# public log, and the job-scoped GITHUB_TOKEN is used rather than a static PAT.
# The prompt is fixed here; the issue body never enters it.

name: Claude Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Triage the issue
        uses: anthropics/claude-code-action@0c127307fa529d701bc1f0f8f9c0bea881c49a9b  # v1.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: "false"
          prompt: |
            Automatically triage newly opened issues by: (1) reading the issue title
            and labels, (2) assigning a triage label (bug/feature/question), and
            (3) adding a comment with next steps. Do not make code changes and do
            not run shell commands.
          claude_args: "--max-turns 10 --allowedTools read"
