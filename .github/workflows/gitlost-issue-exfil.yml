# Issue triage reads only this repository and only the issue title. The org-wide
# read token is gone, the job cannot comment, and the issue body never reaches the
# agent — closing the read-private / write-public pair.

name: Agentic Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Summarise the issue title
        uses: anthropics/claude-code-action@0c127307fa529d701bc1f0f8f9c0bea881c49a9b  # v1.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read only the issue title. Do not read the issue body and do not read
            any other repository. Write a brief triage summary to the job log.
          claude_args: "--max-turns 5 --allowedTools read"
