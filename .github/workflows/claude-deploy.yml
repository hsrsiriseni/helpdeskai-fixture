# Production deploys run behind the `production` environment, whose required
# reviewers must approve each run before any step executes. The agent prompt is
# fixed in this file; no repository content configures the deployment.

name: Claude Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run Claude Code deploy agent
        uses: anthropics/claude-code-action@0c127307fa529d701bc1f0f8f9c0bea881c49a9b  # v1.0.2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Deploy the main branch to production using the standard deployment
            process. Run: bash deploy.sh --env production

            After the deploy completes, summarize what was deployed and report any
            errors encountered.
          claude_args: "--max-turns 15 --allowedTools bash,read"
