# Aider runs a fixed maintenance task. The issue comment selects which task from a
# closed set; no comment text reaches the agent's prompt, and the job holds only
# read scope, so a comment author cannot direct it to write to the repository.

name: Aider Agent Fix

on:
  issue_comment:
    types: [created]

jobs:
  aider-fix:
    if: |
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(fromJSON('["/aider lint","/aider test","/aider format"]'), github.event.comment.body)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install aider
        run: pip install aider-chat

      - name: Select the requested task
        id: task
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          case "$COMMENT_BODY" in
            "/aider lint")   echo "task=Run the linter and report findings." >> "$GITHUB_OUTPUT" ;;
            "/aider test")   echo "task=Run the test suite and report failures." >> "$GITHUB_OUTPUT" ;;
            "/aider format") echo "task=Apply the project code formatter." >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognised command" >&2; exit 1 ;;
          esac

      - name: Run aider agent
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          aider \
            --yes \
            --no-git \
            --model gpt-4o \
            --message "${{ steps.task.outputs.task }}"

      - name: Upload proposed changes for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aider-proposed-changes
          path: |
            **/*
            !.git/**
